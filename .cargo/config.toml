# Android 15+ devices may use 16 KB pages; Play requires 16 KB-aligned native
# libraries. Recent NDKs default to this, but make it explicit.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
