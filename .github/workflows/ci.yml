# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that publish opt in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "30.0.16248370"

# Third-party actions are pinned by commit SHA (tag in the comment).
jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android (cargo-ndk + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;${{ env.NDK_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-ndk
      - name: Build libferrux.so and libferruxterm.so
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          scripts/build-native.sh
      - name: Check 16 KB ELF alignment
        run: |
          readelf="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in android/app/src/main/jniLibs/*/libferrux.so android/terminal-view/src/main/jniLibs/*/libferruxterm.so; do
            ls -l "$so"
            "$readelf" -lW "$so" | awk '$1=="LOAD" { print; if ($NF != "0x4000" && $NF != "0x10000") bad=1 } END { exit bad }'
          done
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: assembleDebug + unit tests
        working-directory: android
        run: ./gradlew --max-workers=4 assembleDebug testDebugUnitTest :terminal-view:publishToMavenLocal -Pferrux.skipCargo=true
      - name: Check APK contents
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libferrux.so'
          # libferrux.so has the terminal natives; a second library would mean a
          # second session manager (docs/REUSE.md).
          if unzip -l "$apk" | grep libferruxterm.so; then echo "libferruxterm.so must not be in the APK"; exit 1; fi
          unzip -l "$apk" | grep -E 'res/.*\.ttf|font' | head
      - name: Check terminal-view AAR contents
        run: |
          aar=$(ls ~/.m2/repository/dev/ferrux/terminal-view/*/terminal-view-*.aar)
          ls -l $aar
          unzip -l $aar | grep -E 'jni/arm64-v8a/libferruxterm.so'
          unzip -l $aar | grep -E 'jni/x86_64/libferruxterm.so'
          unzip -l $aar | grep -E 'classes.jar'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferrux-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  screenshots:
    name: Emulator (API ${{ matrix.api }}, ${{ matrix.mode }})
    needs: android
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full UI checks + the screenshots posted to the PR.
          - api: 35
            mode: full
            publish: true
          # Oldest supported release (minSdk 30): launch, type, verify the grid.
          - api: 30
            mode: smoke
            publish: false
    permissions:
      contents: write # push to the ci-screenshots branch (publish step only)
      pull-requests: write # create/update the screenshot comment
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ferrux-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OUT: screenshots
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/ci-screenshots.sh apk/app-debug.apk ${{ matrix.mode }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: screenshots/
      - name: Post screenshots to the PR
        # Fork PRs get a read-only token, so only same-repo PRs are commented.
        if: always() && matrix.publish && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci-post-screenshots.sh "${{ github.event.pull_request.number }}" "${{ github.run_id }}"
