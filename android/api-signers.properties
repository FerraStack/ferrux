#
# FerraStack signing certificates trusted by the Ferrux API (docs/API.md §3.3).
# One `name=digest` line per key: the SHA-256 of the DER-encoded signing certificate,
# 64 hex characters (colons and case don't matter). Digests are public; never put
# keystores or passwords here.
#
#   keytool -list -v -keystore release.jks -alias <alias> | grep 'SHA256:'
#   apksigner verify --print-certs app-release.apk | grep 'SHA-256 digest'
#
# Apps signed with the same key as Ferrux itself don't need an entry.
# Release keys are pending a decision (docs/API.md §12), so the list is empty.
