# ---- Ferrux identity -------------------------------------------------------
# The Android applicationId. It also determines the Termux-style prefix
# (/data/data/<applicationId>/files/usr) that every package is compiled for,
# so it must match `ferrux_env::APP_PACKAGE` in crates/ferrux-env.
# Change both together.
ferrux.applicationId=dev.ferrux

# Set to true to skip the cargo-ndk build of libferrux.so (e.g. when iterating
# on Kotlin only, or when the Rust toolchain is not installed).
# ferrux.skipCargo=false

# ---- Gradle ------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- Android / Kotlin --------------------------------------------------------
android.useAndroidX=true
kotlin.code.style=official
